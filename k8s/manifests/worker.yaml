apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: transcoder
spec:
  replicas: 1
  selector:
    matchLabels: { app: worker }
  template:
    metadata:
      labels: { app: worker }
    spec:
      terminationGracePeriodSeconds: 120
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            [
              "sh",
              "-c",
              "until nc -z postgres 5432; do echo waiting for postgres; sleep 2; done",
            ]
        - name: wait-for-redis
          image: busybox:1.36
          command:
            [
              "sh",
              "-c",
              "until nc -z redis 6379; do echo waiting for redis; sleep 2; done",
            ]
      containers:
        - name: worker
          image: video-worker:dev
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef: { name: transcoder-secrets }
            - configMapRef: { name: transcoder-config }
          volumeMounts:
            - name: video-storage
              mountPath: /data/videos
          resources:
            requests: { cpu: "500m", memory: "512Mi" }
            limits: { cpu: "2000m", memory: "2Gi" }
      volumes:
        - name: video-storage
          persistentVolumeClaim: { claimName: video-storage }
