apiVersion: v1
kind: Secret
metadata:
  name: transcoder-secrets
  namespace: transcoder
type: Opaque
stringData:
  POSTGRES_USER: "user"
  POSTGRES_PASSWORD: "password"
  POSTGRES_DB: "video_db"
  DATABASE_URL: "postgres://user:password@postgres:5432/video_db?sslmode=disable"
  REDIS_URL: "redis:6379"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: transcoder-config
  namespace: transcoder
data:
  STORAGE_DIR: "/data/videos"
  PORT: "8080"
  ASYNQ_CONCURRENCY: "2"
