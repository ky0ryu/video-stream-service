apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: transcoder
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: transcoder
spec:
  replicas: 1
  strategy:
    type: Recreate # never run two Postgres pods against one PVC
  selector:
    matchLabels: { app: postgres }
  template:
    metadata:
      labels: { app: postgres }
    spec:
      containers:
        - name: postgres
          image: postgres:17
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef: { name: transcoder-secrets }
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
              subPath: pgdata # avoid "lost+found" issues on fresh volumes
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "user", "-d", "video_db"]
            initialDelaySeconds: 30
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "user", "-d", "video_db"]
            initialDelaySeconds: 45
            periodSeconds: 10
          resources:
            requests: { cpu: "100m", memory: "256Mi" }
            limits: { cpu: "500m", memory: "512Mi" }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: postgres-data }
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: transcoder
spec:
  selector: { app: postgres }
  ports:
    - port: 5432
      targetPort: 5432
