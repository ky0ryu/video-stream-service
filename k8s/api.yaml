apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: transcoder
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels: { app: api }
  template:
    metadata:
      labels: { app: api }
    spec:
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            [
              "sh",
              "-c",
              "until nc -z postgres 5432; do echo waiting for postgres; sleep 2; done",
            ]
        - name: wait-for-redis
          image: busybox:1.36
          command:
            [
              "sh",
              "-c",
              "until nc -z redis 6379; do echo waiting for redis; sleep 2; done",
            ]
      containers:
        - name: api
          image: video-api:dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - secretRef: { name: transcoder-secrets }
            - configMapRef: { name: transcoder-config }
          volumeMounts:
            - name: video-storage
              mountPath: /data/videos
          readinessProbe:
            httpGet: { path: /readyz, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits: { cpu: "500m", memory: "512Mi" }
      volumes:
        - name: video-storage
          persistentVolumeClaim: { claimName: video-storage }
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: transcoder
spec:
  selector: { app: api }
  ports:
    - port: 8080
      targetPort: 8080
