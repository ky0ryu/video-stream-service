apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: video-transcoder
spec:
  selector:
    app: postgres

  ports:
    - port: 5432
      targetPort: 5432

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: video-transcoder

spec:
  serviceName: postgres
  replicas: 1

  selector:
    matchLabels:
      app: postgres

  template:
    metadata:
      labels:
        app: postgres

    spec:
      containers:
        - name: postgres
          image: postgres:17

          ports:
            - containerPort: 5432

          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: video-secret
                  key: POSTGRES_USER

            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: video-secret
                  key: POSTGRES_PASSWORD

            - name: POSTGRES_DB
              value: video_db

          volumeMounts:
            - name: postgres-data
              mountPath: /tmp/uploads

          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - user
                - -d
                - video_db

            initialDelaySeconds: 5
            periodSeconds: 5

          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - user
                - -d
                - video_db

            initialDelaySeconds: 30
            periodSeconds: 10

  volumeClaimTemplates:
    - metadata:
        name: postgres-data

      spec:
        accessModes:
          - ReadWriteOnce

        resources:
          requests:
            storage: 2Gi
