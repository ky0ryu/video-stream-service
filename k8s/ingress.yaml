apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: video-ingress
  namespace: video-transcoder

spec:
  rules:
    - host: video.local

      http:
        paths:
          - path: /
            pathType: Prefix

            backend:
              service:
                name: video-api

                port:
                  number: 8080
