version: "2"
sql:
  - engine: "postgresql"
    schema: "../../db/migration"
    queries: "query"
    gen:
      go:
        package: "db"
        out: "model"
        sql_package: "pgx/v5"
        emit_json_tags: true
        overrides:
          - db_type: "uuid"
            go_type: "github.com/google/uuid.UUID"

# use SELECT sqlc.embed(type)
