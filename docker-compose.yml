services:
  postgres:
    image: postgres:17
    container_name: postgres
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-video_db}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d video_db"]
      interval: 5s
      timeout: 5s
      start_period: 10s
      retries: 5

  redis:
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set in .env}"]
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "redis-cli --no-auth-warning -a '${REDIS_PASSWORD}' ping | grep -q PONG",
        ]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: video-api
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
      - STORAGE_DIR=/data/videos
      - PORT=8080
    volumes:
      - video-storage:/data/videos
      - postgres-data
    restart: unless-stopped
    stop_grace_period: 20s

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgres://user:password@postgres:5432/video_db?sslmode=disable
      - REDIS_URL=redis:6379
      - STORAGE_DIR=/data/videos
      - ASYNQ_CONCURRENCY=2
    volumes:
      - video-storage:/data/videos
    restart: unless-stopped
    stop_grace_period: 12m

volumes:
  video-storage:
  redis-data:
