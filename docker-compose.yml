# Connection settings are passed as individual variables, never as a single
# connection string. A secret glued into a URL has to be escaped on the way in
# and parsed back out on the way use, and that is where passwords silently
# break. One variable per setting, and the password never becomes part of a
# string anything has to parse.
x-app-env: &app-env
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_USER: ${DB_USER:?set in .env}
  DB_PASSWORD: ${DB_PASSWORD:?set in .env}
  DB_NAME: ${DB_NAME:?set in .env}
  DB_SSLMODE: disable
  REDIS_ADDR: redis:6379
  REDIS_PASSWORD: ${REDIS_PASSWORD:?set in .env}

services:
  postgres:
    image: postgres:17
    container_name: postgres
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      # the image's own names, fed from the single set of values in .env
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set in .env}
      POSTGRES_USER: ${DB_USER:?set in .env}
      POSTGRES_DB: ${DB_NAME:?set in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      start_period: 10s
      retries: 5

  redis:
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set in .env}"]
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    environment:
      # redis-cli reads REDISCLI_AUTH, so the healthcheck needs no -a flag and
      # the password never appears on a command line.
      REDISCLI_AUTH: ${REDIS_PASSWORD:?set in .env}
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: video-api
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      <<: *app-env
      PORT: "8080"
    volumes:
      - video-storage:/data/videos
    restart: unless-stopped
    stop_grace_period: 20s

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      <<: *app-env
      ASYNQ_CONCURRENCY: "2"
    volumes:
      - video-storage:/data/videos
    restart: unless-stopped
    stop_grace_period: 12m

volumes:
  video-storage:
  redis-data:
  postgres-data:
